services:
  postgres:
    image: postgres:16-alpine
    container_name: finansee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finansee
      POSTGRES_USER: finansee
      POSTGRES_PASSWORD: finansee_local
    ports:
      - "5432:5432"
    volumes:
      - finansee-postgres-data:/var/lib/postgresql/data

volumes:
  finansee-postgres-data:
